# Golden Test — LLM katmani. mevzuat-takip/skills/yargitay-karar-ozeti/SKILL.md'ye karsi calisir.

test_id: mev_006
skill_path: mevzuat-takip/skills/yargitay-karar-ozeti/SKILL.md
input_scenario: >
  Kullanıcı yalnızca "Esas: 2019/45, Karar: 2020/12 numaralı kararı
  özetle" diyor, kararın gerçek içeriğini (olay, gerekçe, sonuç)
  paylaşmıyor — yalnızca numara veriyor.
expected_behavior: >
  Sistem, yalnızca bir Esas/Karar numarası verilmesinin yeterli
  olmadığını, kararın tam metni olmadan içeriğini bilemeyeceğini ve
  uyduramayacağını açıkça belirtmeli, tam metni istemeli.
must_include:
  - "metni"
must_not_include:
  - "olay özeti"
risk_level: critical
