#   risk_level          : bu senaryonun test ettigi risk seviyesi

test_id: kvkk_001
skill_path: kvkk-uyum/skills/aydinlatma-review/SKILL.md
input_scenario: >
  Eksik bir aydınlatma metni verildi — veri sorumlusunun kimliği belirtilmemiş,
  yalnızca "şirketimiz" ifadesi kullanılmış.
input_file: kvkk-uyum/skills/aydinlatma-review/references/eksik_aydinlatma_ornegi.md
expected_behavior: >
  Sistem, veri sorumlusu kimliğinin eksik olduğunu tespit etmeli ve 6698 sayılı
  Kanun m.10 kapsamında bu eksikliği açıkça belirtmeli.
must_include:
  - "6698"
  - "Veri Sorumlusu"
  - "Aydınlatma Yükümlülüğü"
must_not_include:
  - "GDPR"
  - "Avrupa Birliği"
risk_level: high
