version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type: enhancement"
      - "status: dev-approval-needed"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type: enhancement"
      - "status: dev-approval-needed"
    commit-message:
      prefix: "chore(deps)"
