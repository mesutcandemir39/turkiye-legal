name: Otomatik Etiketleme

# PR açıldığında değiştirilen dosyanın yoluna göre domain ve inceleme
# etiketlerini otomatik ekler (örn. kvkk-uyum/ değiştiyse "domain: kvkk"
# ve "status: legal-approval-needed").

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # GÜVENLİK NOTU: actions/labeler PR kodunu checkout etmez, yalnızca
      # değişen dosya yollarını API üzerinden okur. pull_request_target
      # burada da güvenli istisnadır (bkz. greetings.yml notu).
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0 (SHA gercek API ile dogrulandi)
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
