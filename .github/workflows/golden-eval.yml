name: Golden Test (LLM Değerlendirmesi)

# ci.yml'den KASITLI olarak ayrı: bu workflow gerçek bir LLM'e API çağrısı
# yapar, maliyetlidir ve yavaştır. Bu yüzden her PR'da değil, yalnız nightly
# ve "run-llm-eval" etiketiyle işaretlenmiş PR'larda çalışır.
# Bkz. docs/ARCHITECTURE_DECISIONS.md ADR-007.

on:
  schedule:
    - cron: "0 3 * * *" # her gece 03:00 UTC
  pull_request:
    types: [labeled]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  golden-eval:
    name: Golden test senaryolarını çalıştır
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-llm-eval')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install --require-hashes -r scripts/requirements.lock.txt

      - name: Golden testleri çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY tanımlı değil — tüm golden testler SKIPPED olarak raporlanacak, bu PASS anlamına GELMEZ."
          fi
          pytest evaluations/golden/ -v -m llm --junitxml=golden-results.xml

      - name: Sonuçları özetle
        if: always()
        run: |
          if [ -f golden-results.xml ]; then
            python3 -c "
          import xml.etree.ElementTree as ET
          t = ET.parse('golden-results.xml').getroot()
          print(f\"Toplam: {t.get('tests')}, Başarısız: {t.get('failures')}, Hata: {t.get('errors')}, Atlanan (SKIPPED): {t.get('skipped')}\")
          if int(t.get('skipped', 0)) > 0:
              print('NOT: SKIPPED testler API anahtarı eksikliğinden veya henüz yazılmamış skill\\'lerden kaynaklanabilir — bunlar PASS değildir.')
          "
          fi
