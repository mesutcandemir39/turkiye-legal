name: Otomatik PR İncelemesi

# Tamamen deterministik inceleme — HARICI API veya AI TOKEN KULLANMAZ.
# Tüm puanlama, depodaki doğrulayıcı script'lerin gerçek çıkış kodlarından ve
# kural tabanlı Türkçe üslup denetiminden türetilir. Aynı girdi her zaman aynı
# sonucu verir; maliyet ve gizli anahtar gerektirmez.
#
# İnceleme yalnız YORUM yazar ve PASS/WARN/BLOCK etiketi ekler.
# Merge yetkisi YOKTUR — nihai onay CODEOWNERS gereği bakımcıya aittir.
#
# pull_request_target KASITLI OLARAK kullanılmaz — fork'tan gelen kodu secrets
# erişimi olan bir bağlamda çalıştırmak bilinen bir token sızıntısı yüzeyidir.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Deterministik PR incelemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install --require-hashes -r scripts/requirements.lock.txt

      - name: Değişen dosyaları çıkar
        run: git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt

      - name: İncelemeyi çalıştır
        run: |
          python scripts/validate/pr_review.py \
            --files-from changed_files.txt \
            --output review_result.json

      - name: Sonucu PR'a yorum olarak yaz
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
            const emoji = { PASS: '✅', WARN: '⚠️', BLOCK: '⛔' }[result.verdict] || '❓';

            const body = [
              `### 🔍 Otomatik PR İncelemesi: ${emoji} ${result.verdict}`,
              '',
              `${result.changed_file_count} dosya incelendi.`,
              '',
              '| Kriter | Puan | Not |',
              '|---|---|---|',
              ...result.scores.map(s => `| ${s.criterion} | ${s.score}/10 | ${s.note.replace(/\|/g, '\\|')} |`),
              '',
              result.summary,
              '',
              '---',
              '_Bu inceleme **deterministiktir** — dil modeli veya harici API kullanmaz, ' +
              'yalnızca depodaki doğrulayıcılardan türetilir. Öneri niteliğindedir ve ' +
              '**tek başına merge yetkisi yoktur**; nihai onay CODEOWNERS gereği ilgili bakımcıya aittir._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            const labelMap = {
              PASS: 'inceleme: pass',
              WARN: 'inceleme: warn',
              BLOCK: 'inceleme: block',
            };
            const label = labelMap[result.verdict];
            if (label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label],
              });
            }
