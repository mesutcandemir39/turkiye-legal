name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Statik doğrulama (şema, kaynak, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: pip install --require-hashes -r scripts/requirements.lock.txt
      - name: Skill metadata şeması doğrulama
        run: python scripts/validate/validate_skills.py --strict
      - name: Kaynak atfı doğrulama
        run: python scripts/validate/validate_sources.py
      - name: Prompt lint (halüsinasyon deseni, yabancı hukuk sızıntısı)
        run: python scripts/validate/lint_prompts.py
      - name: Araç yetkisi (tool scope) lint
        run: python scripts/validate/lint_tool_scope.py
      - name: marketplace.json ↔ plugin.json tutarlılığı
        run: python scripts/generate/generate_marketplace.py --check

  static-tests:
    name: Statik regresyon testleri (LLM'siz)
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: pip install --require-hashes -r scripts/requirements.lock.txt
      - name: pytest çalıştır
        run: pytest evaluations/static/ -v

  # NOT: Golden (LLM'li) testler burada ÇALIŞMAZ — API anahtarı gerektirir
  # ve maliyetlidir. Bkz. .github/workflows/golden-eval.yml (nightly + etiket tetikli).
  # Statik katman ile LLM katmanının ayrımı için docs/ARCHITECTURE_DECISIONS.md ADR-007.
