# Etiket sistemi — turkiye-legal
# GitHub CLI ile toplu uygulamak için:
#   gh label list  (mevcutları görmek için)
#   yq/jq ile bu dosyayı okuyup `gh label create` döngüsü kurulabilir,
#   ya da github-label-sync gibi bir araçla senkronize edilir.

# --- Tür ---
- name: "type: bug"
  color: "d73a4a"
  description: "Teknik/yazılımsal hata"
- name: "type: legal-error"
  color: "b60205"
  description: "Hukuki hata — yanlış/güncel olmayan mevzuat, sahte karar no vb."
- name: "type: skill-request"
  color: "0e8a16"
  description: "Yeni skill / agent / routine talebi"
- name: "type: enhancement"
  color: "a2eeef"
  description: "Genel teknik iyileştirme talebi"
- name: "type: documentation"
  color: "0075ca"
  description: "Dokümantasyon değişikliği"
- name: "type: security"
  color: "e11d21"
  description: "Güvenlik ile ilgili (hassas olanlar public issue olarak açılmamalı)"

# --- Durum ---
- name: "status: needs-review"
  color: "fbca04"
  description: "İlk inceleme bekliyor"
- name: "status: legal-approval-needed"
  color: "d93f0b"
  description: "Hukuk bakımcısı onayı bekliyor"
- name: "status: dev-approval-needed"
  color: "5319e7"
  description: "Geliştirici bakımcı onayı bekliyor"
- name: "status: blocked"
  color: "000000"
  description: "Başka bir işe bağımlı, ilerleyemiyor"
- name: "status: wontfix"
  color: "ffffff"
  description: "Bilinçli olarak yapılmayacak"

# --- Öncelik ---
- name: "priority: high"
  color: "e99695"
  description: "Hak kaybı riski veya kritik hata içerir"
- name: "priority: medium"
  color: "fef2c0"
  description: "Standart öncelik"
- name: "priority: low"
  color: "c2e0c6"
  description: "Aciliyeti yok"

