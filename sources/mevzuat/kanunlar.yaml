# Doğrulanmış kanun kayıt defteri — turkiye-legal
#
# BU DOSYA HALÜSİNASYON SAVUNMASININ TEMELİDİR (bkz. docs/ARCHITECTURE_DECISIONS.md ADR-005).
# Her SKILL.md'nin turkiye_legal.sources[].numara alanı, bu defterdeki bir
# "numara" değeriyle eşleşmek zorundadır — scripts/validate/validate_sources.py
# bunu CI'da zorunlu kılar.
#
# KURAL: Bir kanunu buraya eklemeden önce resmî kaynağa (mevzuat.gov.tr veya
# Resmî Gazete) karşı doğrulayın. Doğrulanamayan hiçbir satır buraya girmez.
# Bu, bir "good-first-legal-issue" görevidir — katkı sağlamak için
# CONTRIBUTING.md Bölüm 1'e bakın.
#
# Alan adları:
#   numara        : Kanun numarası (string — "no:" DEĞİL, bkz. validate_skills.py başlığı)
#   ad            : Kanunun tam resmî adı
#   kabul_tarihi  : Kanunun kabul tarihi (YYYY-MM-DD)
#   rg_tarih_sayi : Resmî Gazete yayım tarihi ve sayısı
#   dogrulama_url : Doğrulamanın yapıldığı resmî kaynak URL'si
#   durum         : "yururlukte" | "kismen_yururlukte" | "yururlukten_kalkti"
#   son_dogrulama : Bu kaydın en son ne zaman ve nasıl doğrulandığı (tarih + yöntem)
#
# BU İLK 10 KAYIT NASIL DOĞRULANDI: 2026-08-17 tarihinde her biri bağımsız
# arama sorgularıyla çapraz kontrol edildi (mevzuat.gov.tr, adalet.gov.tr,
# ilgili kurum PDF'leri, TBMM tutanakları gibi birden fazla kaynak). Model
# belleğinden yazılıp doğrulanmadan eklenen HİÇBİR satır yoktur — bkz. ADR-005.

