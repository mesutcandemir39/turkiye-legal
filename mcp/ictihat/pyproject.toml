[project]
name = "turkiye-legal-ictihat-mcp"
version = "0.5.0"
description = "Türk yargı kararlarını (Yargıtay/Bölge Adliye + Danıştay + AYM bireysel başvuru) yapay zekâ araçlarına açan MCP sunucusu."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mesut Can Demir" }]
keywords = ["mcp", "turkish-law", "ictihat", "yargitay", "uyap", "case-law", "llm"]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "anyio>=4",
]

[project.scripts]
turkiye-legal-ictihat = "turkiye_legal_ictihat.server:main"

[project.urls]
Homepage = "https://github.com/mesutcandemir39/turkiye-legal"
Documentation = "https://github.com/mesutcandemir39/turkiye-legal/tree/main/docs"
Repository = "https://github.com/mesutcandemir39/turkiye-legal"
Issues = "https://github.com/mesutcandemir39/turkiye-legal/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turkiye_legal_ictihat"]
